[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "abcdi-config"
description = "A Python library for configuration-based dependency injection using the abcdi library"
readme = "README.md"
requires-python = ">=3.13"
license = { text = "MIT" }
authors = [{ name = "Julian Kenwood", email = "julian.kenwood@example.com" }]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dynamic = ["version", "dependencies"]

[project.urls]
Homepage = "https://github.com/nomad010/abcdi-config"
Repository = "https://github.com/nomad010/abcdi-config"
Issues = "https://github.com/nomad010/abcdi-config/issues"

[tool.setuptools.dynamic]
version = { file = "version" }
dependencies = { file = ["requirements.txt"] }

[tool.setuptools.packages.find]
where = ["src"]

[project.optional-dependencies]
dev = [
    "build>=0.10.0",
    "twine>=4.0.0",
    "pytest>=7.0.0",
    "pylint>=2.15.0",
    "mypy>=1.0.0",
]

[project.scripts]
